# Pylos integration-test Dovecot configuration.
#
# This is a DROP-IN, not a replacement for /etc/dovecot/dovecot.conf: run.sh
# mounts it at /etc/dovecot/conf.d/zz-pylos.conf inside the official
# dovecot/dovecot:2.4.x image. Two reasons:
#
#   * The image ships a working rootless 2.4 base config (base_dir, mail_uid,
#     listener ports, passdb) that a hand-written full config would have to
#     reproduce exactly. Overriding only what the tests need is far less
#     brittle.
#   * The image's own conf.d/ssl.conf points at cert paths that do not exist in
#     the image. Included files are globbed alphabetically, so the "zz-" prefix
#     guarantees this file is merged last and its cert paths win.
#
# The account is provided by the image's conf.d/auth.conf, which is
# `passdb static { password = %{env:USER_PASSWORD} }` — run.sh passes
# USER_PASSWORD=testpass, so any username authenticates with that password.

# Point TLS at the certificate generated by docker/gen-certs.sh. Only the
# imaps/sieve listeners are published to the host, so every test connection is
# a real TLS handshake against this certificate.
ssl_server {
  cert_file = /etc/dovecot/certs/cert.pem
  key_file = /etc/dovecot/certs/key.pem
}

# Log authentication decisions to the container log so a failing run can be
# diagnosed from `docker logs`.
auth_verbose = yes

# Dovecot defaults to a 2s delay on a failed login plus a lingering penalty for
# the offending IP, which made the wrong-password test slow and leaked several
# seconds into whichever test ran next. The client still receives a real
# AUTHENTICATIONFAILED; only the punishment timer is removed.
auth_failure_delay = 0

# Special-use mailboxes. `auto = subscribe` makes Dovecot create and subscribe
# them on first login, so the SPECIAL-USE flags actually appear in LIST output
# instead of only being declared.
namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}
