# Publishes to npm on a version tag through npm trusted publishing, which
# authenticates with the OIDC token `id-token: write` grants, so no long-lived npm
# token exists to leak or expire. The trusted publisher on npmjs.com names this
# file, so renaming it stops publishing. Provenance comes with it, and npm checks
# package.json's `repository.url` against this repository, so that field has to
# keep matching.
#
# Actions are pinned by commit SHA rather than by tag. A tag is a moving
# reference the action's owner can repoint, so `@v4` would grant every future
# v4 the publish rights this job holds; a SHA is the artifact that was reviewed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag is what a human types, the version is what gets published, and
      # nothing else in this pipeline compares them. Without this, pushing
      # v0.2.0 at a tree whose package.json still says 0.1.0 publishes 0.1.0
      # (or fails on an already-published version) under a tag claiming
      # otherwise, and the npm version cannot be corrected afterwards.
      # manifest.json is checked too, since the bundle would otherwise install
      # under a stale version.
      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for file in package.json manifest.json; do
            version="v$(node -p "require('./$file').version")"
            if [ "$tag" != "$version" ]; then
              echo "tag $tag does not match $file version $version" >&2
              exit 1
            fi
          done
      # Node 24 because trusted publishing needs npm 11.5.1 or newer, and Node 22
      # bundles npm 10. No dependency cache: a publish job should not restore
      # state another workflow run could have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # The same gates CI runs, repeated here: a tag can be pushed without a
      # green CI run, and this is the last point before the package is public.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # No explicit build step: prepublishOnly runs `npm run build` for us, so
      # the published dist is always compiled from the commit being published.
      - run: npm publish

  # Built without write access: npm ci runs dev-dependency install scripts, and
  # anything they leave behind (a planted `gh` on PATH, say) would otherwise run
  # in the step that holds the token.
  bundle:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      # production dependencies only, and no install scripts, in what users run
      - name: Stage the bundle
        run: |
          set -euo pipefail
          mkdir bundle
          cp -R manifest.json icon.png package.json package-lock.json LICENSE README.md dist bundle/
          (cd bundle && npm ci --omit=dev --ignore-scripts)
      - run: npx mcpb pack bundle pylos-mcp.mcpb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: pylos-mcp.mcpb

  # A fresh runner that installs nothing. Draft only: the notes are written and
  # the release published by hand.
  draft:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
      - name: Draft the release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" pylos-mcp.mcpb
