# Publishes to npm on a version tag through npm trusted publishing, which
# authenticates with the OIDC token `id-token: write` grants, so no long-lived npm
# token exists to leak or expire. The trusted publisher on npmjs.com names this
# file, so renaming it stops publishing. Provenance comes with it, and npm checks
# package.json's `repository.url` against this repository, so that field has to
# keep matching.
#
# Actions are pinned by commit SHA rather than by tag. A tag is a moving
# reference the action's owner can repoint, so `@v4` would grant every future
# v4 the publish rights this job holds; a SHA is the artifact that was reviewed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Everything that runs dependency code happens here, without the OIDC token:
  # an install script or a compromised dev tool could otherwise mint one that npm
  # trusted publishing accepts for this workflow.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is what a human types, the version is what gets published, and
      # nothing else in this pipeline compares them. Without this, pushing
      # v0.2.0 at a tree whose package.json still says 0.1.0 publishes 0.1.0
      # (or fails on an already-published version) under a tag claiming
      # otherwise, and the npm version cannot be corrected afterwards.
      # manifest.json and server.json are checked too, since the bundle and the
      # registry listing would otherwise carry a stale version.
      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for file in package.json manifest.json server.json; do
            version="v$(node -p "require('./$file').version")"
            if [ "$tag" != "$version" ]; then
              echo "tag $tag does not match $file version $version" >&2
              exit 1
            fi
          done
      # No dependency cache: a release build should not restore state another
      # workflow run could have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      # The same gates CI runs, repeated here: a tag can be pushed without a
      # green CI run, and this is the last point before the package is public.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # npm pack skips prepublishOnly, so the build is explicit
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: pylos-mcp-*.tgz

  # Publishes the tarball built above and runs nothing else. Node 24 because
  # trusted publishing needs npm 11.5.1 or newer, and Node 22 bundles npm 10.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --ignore-scripts "pylos-mcp-${GITHUB_REF_NAME#v}.tgz"

  # Signs in to the MCP registry with this run's OIDC identity, which the
  # registry maps to the io.github.adamVass namespace, so no login or token is
  # kept anywhere. Nothing is installed but the checksummed publisher binary.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher 1.8.1
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # the registry checks mcpName against npm, which can lag the publish briefly
      - name: Publish server.json
        run: |
          for attempt in 1 2 3; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1

  # Built without write access: npm ci runs dev-dependency install scripts, and
  # anything they leave behind (a planted `gh` on PATH, say) would otherwise run
  # in the step that holds the token.
  bundle:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      # production dependencies only, and no install scripts, in what users run
      - name: Stage the bundle
        run: |
          set -euo pipefail
          mkdir bundle
          cp -R manifest.json icon.png package.json package-lock.json LICENSE README.md dist bundle/
          (cd bundle && npm ci --omit=dev --ignore-scripts)
      - run: npx mcpb pack bundle pylos-mcp.mcpb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: pylos-mcp.mcpb

  # A fresh runner that installs nothing, which is also why the signing identity
  # lives here: an install script on the bundle runner could otherwise mint an
  # OIDC token that npm trusted publishing accepts for this workflow. Draft only:
  # the notes are written and the release published by hand.
  draft:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pylos-mcp.mcpb
      - name: Draft the release with the bundle and its provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" pylos-mcp.mcpb.sigstore.json
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" pylos-mcp.mcpb pylos-mcp.mcpb.sigstore.json
