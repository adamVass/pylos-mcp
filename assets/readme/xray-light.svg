<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="776" viewBox="0 0 880 776" role="img" aria-labelledby="t d">
<title id="t">pylos names what your mail client hides</title>
<desc id="d">An account-security message in a mail client. A scan sweeps down and reveals a Cyrillic lookalike letter in the sender address, a collapsed Reply-To header pointing to another domain, an instruction to the AI assistant hidden with display:none, and a base64 payload at zero font size. Beneath the card, the Warnings line pylos returns names each finding: sender_mismatch, hidden_text, instruction_patterns, mixed_script, encoded_blob. The email content reaches the assistant inside a fence marked as data, not instructions.</desc>
